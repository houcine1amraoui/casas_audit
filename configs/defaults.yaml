run_name: casas_inventory

paths:
  output_dir: null            # default: {project_root_dir}/outputs/{run_name}
  cache_dir: null             # default: {project_root_dir}/cache/casas
  local_dir: /content/casas_local   # fast local disk for extracted files (not Drive)

# Where the data comes from:
#   folders: already unzipped under {dataset_folder}: data/, labeled_data/, floorplans/ (searched up to 3 levels deep)
#   zips:    data.zip, labeled_data.zip, floorplans.zip in {dataset_folder} (downloaded if missing and zenodo.download)
#   auto:    folders if a data/ folder is found, else zips
source: auto
folders: {data: data, labeled: labeled_data, floorplans: floorplans}

# Zenodo record 15708568: CASAS free-living, mapped sensor names (CC BY 4.0)
zenodo:
  record: "15708568"
  files:
    data.zip: 973a4ec0b67269566227ce8a5a3a9e21
    floorplans.zip: f108101628fa24fae6ff8687c6d98d68
    labeled_data.zip: ec37d679e85a6ae39e84994888afd514
  download: true              # zips mode only: download into {dataset_folder} if missing or md5 differs
  verify_md5: true

inventory:
  parts: [data, labeled, floorplans]   # e.g. [labeled, floorplans] to add those to an existing data inventory
  workers: 0                  # 0 = number of CPUs
  max_bad_examples: 5         # unparsable lines kept per home
  gap_hours: [1, 6, 24, 72]   # event-free gaps counted per home
  active_day_min_events: 50   # a day with fewer events counts as inactive (sensor or home down)
  top_messages: 8

selection:                    # proposal rules (step 1 marks candidates; step 2 run_select builds the cohort)
  min_active_days: 56         # step 1: 8 weeks
  min_run_days: 28            # longest run of consecutive active days
  min_sensors: 10
  min_rooms_with_2plus: 3     # step 2: rooms (type + letter) with >= 2 motion sensors
  core_cover: 0.8             # step 2: core sensor = in-room motion sensor covering >= 80% of the home's span
  min_window_active_days: 56  # step 2: active days inside the stable window

# ---------------- step 3: audit of the selected homes (run_audit)
audit:
  run_name: casas_audit
  tiers: [core_single]        # homes_selection.csv tiers to audit
  workers: 0                  # 0 = number of CPUs
  silence_hours: 12           # event-free stretches reported (absence if a door/entry event precedes it)
  stuck_hours: 2              # motion ON held this long = stuck cycle
  dropout_min_median: 5       # a sensor-day counts as dropout if the sensor is silent on an active day but usually fires >= 5/day
  classify: {rare_median_daily: 1, stuck_time_share: 0.05, dropout_run_days: 7, dropout_share: 0.2, chatter_daily: 20000,
             partial_days: 14}        # first activation > 14 days after the window starts, or last > 14 days before it ends
  clean:                      # clean sub-window inside the stable window (features + tests use only these days)
    min_alive_share: 0.9      # a clean day: active, and >= 90% of the core motion sensors fire
    gap_tolerance: 2          # up to 2 bad days in a row are bridged (but not used)
    max_days: 180             # cap per home (first 180 clean days), so long deployments do not dominate or drift for years
    min_clean_days: 56        # homes with fewer clean days are reported but left out of the tests
  n_bins: 6                   # 4-h bins for daily features
  step_minutes: 10            # per-step activation counts cached for Stage E (cache/casas/steps/<home>.npz)
  std_floor: 0.05
  within: {ref_days: 28, late_days: 28, n_perm: 1000, seed: 0}
  ident: {profile_frac: 0.4, test_frac: 0.4}   # first 40% of good days = profile, last 40% = test (20% gap between)
  label_join_gap_s: 1800
  figures_per_home: true

# ---------------- Stage E: preliminary models on the audited homes (run_stage_e)
stage_e:
  run_name: casas_stage_e_v3   # v3: activity-deficit score, per-type injected results, layout controls, 100 epochs (v1/v2 kept)
  homes: null                 # null = every audited home with enough clean days; or a list, e.g. [tm008, ihs108]
  force: false                # recompute results that already exist (runs/<home>/<model>_s<seed>.json)
  window_steps: 12            # 2 h of 10-min steps as input
  horizon_steps: 6            # forecast 1 h ahead
  split: {train: 0.6, val: 0.15, test: 0.25}   # chronological over each home's clean days
  std_floor: 0.25
  models: [persistence, seasonal_naive, var, lstm, lstm_ae, hae, hae_random, hae_flat, gdn_nograph, gdn, gdn_hier, gdn_hier_random]
  #        add gdn_hier_group, gdn_hier_group_random for the functional grouping (bedroom/bathroom/kitchen/living/transit/other)
  seeds: [0, 1, 2]            # GDN and HAE families
  seeds_other_trainable: [0]  # lstm, lstm_ae
  hierarchy_level: room       # gdn_hier(_random): room ids (BedroomA, KitchenA, ...); gdn_hier_group(_random): room groups
  residual: false             # all channels are event counts: no persistence residual
  var_lambdas: [0.001, 0.01, 0.1, 1.0, 10.0]
  hp: {hidden: 64, layers: 1, dropout: 0.0, latent: 32, emb_dim: 32, topk: 5, room_dim: 8}
  #   hae: home code = latent (32), one room code of room_dim (8) per room; hae_flat: one shared code of room_dim x n_rooms
  train: {lr: 0.001, weight_decay: 0.0, batch_size: 256, max_epochs: 100, patience: 6, grad_clip: 1.0}
  score:
    channel_agg: [max, mean, top3]
    smooth_steps: [1, 6, 12]
    calibration: [none, hour]   # hour: window score relative to the val windows of the same time of day
    calibration_bin_hours: 2
    deficit: true             # also try max(model score, activity deficit for this hour), both calibrated per hour on val
    select: val_injected
    default: [mean, 6, hour]
  score_scale_floor: 0.05
  day_threshold_quantile: 0.95   # a day is flagged if its score exceeds the 95th percentile of the home's own val days
  impostor: {days_per_home: 7, min_matched_share: 0.5, seed: 0}   # other homes' test days scored by this home's model
  inject:
    types: [night_activity, inactivity, routine_shift, room_swap]
    n_per_type: 10
    segment_hours: 2
    gap_steps: 6
    min_effect: 0.5
    seed: 123
